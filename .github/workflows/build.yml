      # 7.6 [網路工具] 智慧編譯 新增 Arptables
      - name: 🔥 Network Tools (Smart Compile Arptables)
        run: |
          echo "::group::Smart Compile Network Tools"
          
          BASE_DIR="$GITHUB_WORKSPACE/padavan-ng/trunk/user"
          ARP_ROOT="$BASE_DIR/arptables"
          
          echo "⬇️ Processing Arptables..."
          mkdir -p "$ARP_ROOT"
          cd "$ARP_ROOT" || exit 1
          
          if [ ! -f "Makefile" ] || ! grep -q "arptables" "Makefile"; then
            ARP_TAR="arptables-0.0.5.tar.gz"
            ARP_URL="https://www.netfilter.org/pub/arptables/arptables-0.0.5.tar.gz"
            
            echo "   Downloading $ARP_URL ..."
            wget --no-check-certificate "$ARP_URL" -O "$ARP_TAR" || exit 1
            tar -xf "$ARP_TAR" || exit 1
            rm -f "$ARP_TAR"
            
            ARP_SRC_NAME=$(ls -d arptables-0*/ | head -n 1 | sed 's/\///')
            echo "   Detected source: [$ARP_SRC_NAME]"
            chmod -R u+w "$ARP_SRC_NAME"
          
            echo "🔧 Creating Arptables Wrapper Makefile..."
            cat << EOF > Makefile
SRC_NAME=$ARP_SRC_NAME

all:
	\$(MAKE) -C \$(SRC_NAME) \
		CC="\$(CC)" \
		AR="\$(AR)" \
		KERNEL_DIR=\$(KERNEL_HEADERS_PATH) \
		COPT_FLAGS="-Os -static" \
		LDFLAGS="-static" \
		arptables-legacy

romfs:
	\$(ROMFSINST) \$(SRC_NAME)/arptables-legacy /bin/arptables

clean:
	\$(MAKE) -C \$(SRC_NAME) clean
EOF
          
            echo "🔧 Registering arptables in trunk/user/Makefile..."
            cd "$BASE_DIR" || exit 1
            
            if ! grep -q "dir_y += arptables" Makefile; then
                if grep -q "dir_y += ebtables" Makefile; then
                    sed -i '/dir_y += ebtables/a dir_y += arptables' Makefile
                else
                    echo "dir_y += arptables" >> Makefile
                fi
                echo "   ✅ Added to compilation list."
            else
                echo "   ⚠️ Already in compilation list."
            fi
          else
            echo "⚠️ Arptables seems already configured. Skipping."
          fi

          echo "🔧 Deep-Cleaning & Enabling Kernel modules..."
          cd "$GITHUB_WORKSPACE"
          TARGET_KCONF="padavan-ng/trunk/linux-3.4.x/.config"
          
          if [ -f "$TARGET_KCONF" ]; then
             MODULES="CONFIG_IP_NF_ARPTABLES CONFIG_IP_NF_ARPFILTER CONFIG_IP_NF_ARP_MANGLE CONFIG_NF_LOG_ARP CONFIG_BRIDGE_EBT_ARP CONFIG_BRIDGE_EBT_ARPREPLY"
             for mod in $MODULES; do
                if grep -q "$mod" "$TARGET_KCONF"; then
                   sed -i "s|^.*$mod.*$|$mod=m|" "$TARGET_KCONF"
                   echo "   ✅ Forced $mod=m (Updated)"
                else
                   echo "$mod=m" >> "$TARGET_KCONF"
                   echo "   ✅ Forced $mod=m (Added)"
                fi
             done
          fi
          echo "::endgroup::"

      # 7.7 [驅動魔改] 修復 MT7628 / MT7610E 無線驅動斷線與快速重連 (適配 WR841N-V13 SoC)
      - name: 🔥 Patch Wi-Fi Driver (Anti-Disconnect & Fast Reconnect)
        run: |
          echo "::group::Applying Universal Wi-Fi Driver Patch"
          
          APCLI_FILES=$(find padavan-ng/trunk/proprietary/rt_wifi -type f -name "ap_apcli.c")
          CTRL_FILES=$(find padavan-ng/trunk/proprietary/rt_wifi -type f -name "apcli_ctrl.c")

          if [ -n "$APCLI_FILES" ]; then
            for f in $APCLI_FILES; do
              echo "🔧 Patching Beacon Timeout: $f"
              sed -i 's/12[[:space:]]*\*[[:space:]]*OS_HZ/60 * OS_HZ/g' "$f"
            done
          else
            echo "::warning:: ap_apcli.c not found, skipping beacon patch."
          fi

          if [ -n "$CTRL_FILES" ]; then
            for f in $CTRL_FILES; do
              echo "🔧 Patching Fast Reconnect Logic: $f"
              sed -i 's/^[[:space:]]*NdisZeroMemory.*ApCliMlmeAux.Bssid/\/\/&/' "$f"
              sed -i 's/^[[:space:]]*.*ApCliMlmeAux.SsidLen[[:space:]]*=[[:space:]]*0/\/\/&/' "$f"
              sed -i 's/^[[:space:]]*NdisZeroMemory.*ApCliMlmeAux.Ssid,/\/\/&/' "$f"
              sed -i 's/^[[:space:]]*.*ApCliMlmeAux.Rssi[[:space:]]*=[[:space:]]*0/\/\/&/' "$f"
            done
            echo "🎉 Wi-Fi driver patched for fast reconnect."
          else
            echo "::warning:: apcli_ctrl.c not found, skipping."
          fi
          echo "::endgroup::"

      - name: 🌐 Custom Language Selector
        run: |
          echo "::group::Setting up WebUI Language"
          
          SELECTED_LANG_OPTION="${{ inputs.language_select }}"
          TARGET_BOARD="${{ inputs.target_select }}"
          TEMPLATES_DIR="padavan-ng/trunk/configs/templates"
          
          if [ "$SELECTED_LANG_OPTION" == "English_Only" ]; then
            LANG_CODE="NONE"
            echo "RELEASE_LANG=English Only" >> $GITHUB_ENV
          else
            LANG_CODE=$(echo "$SELECTED_LANG_OPTION" | cut -d' ' -f1)
            echo "RELEASE_LANG=English + $SELECTED_LANG_OPTION" >> $GITHUB_ENV
          fi
          
          echo "🎯 Target Board: $TARGET_BOARD"
          echo "🗣️ Selected Language Code: $LANG_CODE"
          
          CONFIG_PATH=$(find "$TEMPLATES_DIR" -type f -name "*.config" | grep -i "$TARGET_BOARD.config" | head -n 1)
          
          if [ -z "$CONFIG_PATH" ]; then
             echo "⚠️ Config not found via strict match, trying loose search..."
             CONFIG_PATH=$(find "$TEMPLATES_DIR" -type f -name "*.config" | grep -i "$TARGET_BOARD" | head -n 1)
          fi
          
          if [ -f "$CONFIG_PATH" ]; then
            echo "📝 Modifying Config: $CONFIG_PATH"
            sed -i 's/^CONFIG_FIRMWARE_INCLUDE_LANG_.*=y/#&/' "$CONFIG_PATH"
            echo "✅ All non-English languages disabled."
            
            if [ "$LANG_CODE" != "NONE" ]; then
              TARGET_LANG_CONFIG="CONFIG_FIRMWARE_INCLUDE_LANG_$LANG_CODE"
              if grep -q "$TARGET_LANG_CONFIG" "$CONFIG_PATH"; then
                sed -i "s/^.*$TARGET_LANG_CONFIG.*/$TARGET_LANG_CONFIG=y/" "$CONFIG_PATH"
                echo "✅ Enabled language: $LANG_CODE"
              else
                echo "$TARGET_LANG_CONFIG=y" >> "$CONFIG_PATH"
                echo "✅ Appended language config: $LANG_CODE"
              fi
            else
              echo "ℹ️ Keeping English Only."
            fi
            
            echo "🔍 Current Enabled Languages in Config:"
            grep "^CONFIG_FIRMWARE_INCLUDE_LANG_" "$CONFIG_PATH" || echo "(None - English Only)"
          else
            echo "❌ Error: Could not find template config for $TARGET_BOARD"
            exit 1
          fi
          echo "::endgroup::"
      
      - name: 🕊️ Dave Täht Tribute & CAKE Patch
        run: |
          echo "::group::Applying CAKE to Kernel 3.4 Config"
          
          TARGET_BOARD="${{ inputs.target_select }}"
          BOARDS_DIR="padavan-ng/trunk/configs/boards"
          
          echo "🔍 Searching for config file for board: $TARGET_BOARD..."
          CONFIG_PATH=$(find "$BOARDS_DIR" -name "kernel-3.4.x.config" | grep "/$TARGET_BOARD/" | head -n 1)

          if [ -z "$CONFIG_PATH" ]; then
             echo "⚠️  Direct match not found, trying loose search..."
             CONFIG_PATH=$(find "$BOARDS_DIR" -type f -name "kernel-3.4.x.config" | grep "$TARGET_BOARD" | head -n 1)
          fi

          if [ -f "$CONFIG_PATH" ]; then
            echo "🎯 Found Config: $CONFIG_PATH"
            if grep -qE "CONFIG_NET_SCH_CAKE=[ym]" "$CONFIG_PATH"; then
              echo "⚠️ CAKE module is already enabled in config."
            else
              echo "🔧 Injecting CAKE module..."
              if grep -qE "CONFIG_NET_SCH_FQ_CODEL=[ym]" "$CONFIG_PATH"; then
                sed -i '/CONFIG_NET_SCH_FQ_CODEL=/a CONFIG_NET_SCH_CAKE=m' "$CONFIG_PATH"
                echo "✅ Inserted CAKE after FQ_CODEL."
              else
                echo "CONFIG_NET_SCH_CAKE=m" >> "$CONFIG_PATH"
                echo "✅ Appended CAKE to end of file."
              fi
            fi
            
            if grep -qE "CONFIG_NET_SCH_CAKE=[ym]" "$CONFIG_PATH"; then
               echo "🎉 CAKE Patch Applied Successfully!"
            else
               echo "❌ Error: Failed to apply CAKE patch."
               exit 1
            fi
          else
            echo "❌ Config file not found for $TARGET_BOARD"
            exit 1
          fi
          echo "::endgroup::"
      
      # 8. 開始編譯
      - name: Build firmware
        run: |
          echo "::group::Build Process"
          cp build.config padavan-ng/trunk/.config
          cd padavan-ng/trunk
          
          ./clear_tree.sh > /dev/null 2>&1
          rm -rf tmp staging
          
          echo "Starting build... Logs will be saved to build.log"
          set -o pipefail
          ./build_firmware.sh 2>&1 | tee build.log
          echo "::endgroup::"

      # 9. 智慧打包與產物偵測 (含 iptables Debug 檔案)
      - name: Smart-Pack & Debug Collection
        run: |
          echo "::group::Smart Packing"
          
          if [ -f "padavan-ng/trunk/.config" ]; then
            source "padavan-ng/trunk/.config"
          fi

          WORK_DIR=$(pwd)
          PACK_DIR="$WORK_DIR/output_pack"
          IMAGES_DIR="$WORK_DIR/padavan-ng/trunk/images"
          PARTITIONS_FILE="$WORK_DIR/padavan-ng/trunk/configs/boards/$CONFIG_VENDOR/$CONFIG_FIRMWARE_PRODUCT_ID/partitions.config"
          
          mkdir -p "$PACK_DIR"
          REPORT_FILE="$PACK_DIR/file_report.txt"
          touch "$REPORT_FILE"
          
          echo "Packing Artifacts to: $PACK_DIR"
          
          [ -f "padavan-ng/trunk/.config" ] && cp "padavan-ng/trunk/.config" "$PACK_DIR/build.config"
          [ -f "padavan-ng/trunk/configs/boards/busybox.config" ] && cp "padavan-ng/trunk/configs/boards/busybox.config" "$PACK_DIR/busybox.config"
          [ -f "padavan-ng/trunk/user/shared/defaults.h" ] && cp "padavan-ng/trunk/user/shared/defaults.h" "$PACK_DIR/defaults.h.txt"
          [ -f "padavan-ng/trunk/user/www/dict/CN.dict" ] && cp "padavan-ng/trunk/user/www/dict/CN.dict" "$PACK_DIR/CN.dict.txt"
          [ -f "padavan-ng/trunk/linux-3.4.x/.config" ] && cp "padavan-ng/trunk/linux-3.4.x/.config" "$PACK_DIR/kernel.config"
          [ -f "padavan-ng/trunk/build.log" ] && cp "padavan-ng/trunk/build.log" "$PACK_DIR/build.log"

          BB_SRC_DIR="padavan-ng/trunk/user/busybox/busybox-1.37.0"
          DEBUG_BB_DIR="$PACK_DIR/debug_busybox"
          mkdir -p "$DEBUG_BB_DIR"

          if [ -d "$BB_SRC_DIR/patches" ]; then
              echo "✅ Found BusyBox patches directory, collecting..."
              cp "$BB_SRC_DIR/patches"/*.patch "$DEBUG_BB_DIR/" 2>/dev/null || true
              echo "- 🛡️ **BusyBox Patches**: Collected in \`debug_busybox\`" >> "$REPORT_FILE"
              if [ -f "$BB_SRC_DIR/.config" ]; then
                  cp "$BB_SRC_DIR/.config" "$DEBUG_BB_DIR/busybox_actual_build.config"
              fi
          else
              echo "⚠️ Warning: BusyBox patches directory not found."
              echo "- ⚠️ **BusyBox Patches**: Not found" >> "$REPORT_FILE"
          fi

          IPT_SRC_DIR="padavan-ng/trunk/user/iptables/iptables-1.8.11"
          IPT_BASE_DIR="padavan-ng/trunk/user/iptables"
          DEBUG_DIR="$PACK_DIR/debug_iptables"
          mkdir -p "$DEBUG_DIR"
          
          if [ -d "$IPT_BASE_DIR/patches_archive" ]; then
              cp "$IPT_BASE_DIR/patches_archive"/*.patch "$DEBUG_DIR/"
              echo "- 🛡️ **Patches**: All patches collected in debug_iptables" >> "$REPORT_FILE"
          else
              echo "⚠️ Warning: patches directory not found in $IPT_BASE_DIR"
              echo "- ⚠️ **Patches**: Not found (Collection failed)" >> "$REPORT_FILE"
          fi
          
          if [ -f "$IPT_BASE_DIR/patch_summary.log" ]; then
              cp "$IPT_BASE_DIR/patch_summary.log" "$DEBUG_DIR/patch_summary.log"
              echo "- 📜 **Patch Log**: Included" >> "$REPORT_FILE"
          fi

          TARGET_FILE="$IPT_SRC_DIR/libxtables/xtables.c"
          if [ -f "$TARGET_FILE" ]; then
              if grep -q "#if 0" "$TARGET_FILE" && grep -q "Warning: Extension %s is not supported" "$TARGET_FILE"; then
                  cp "$TARGET_FILE" "$DEBUG_DIR/xtables_patched.c"
                  echo "✅ Detected PATCHED xtables.c - Saving as xtables_patched.c"
                  echo "- 📄 **Source**: \`xtables_patched.c\` (✅ Patched successfully)" >> "$REPORT_FILE"
              else
                  cp "$TARGET_FILE" "$DEBUG_DIR/xtables_original.c"
                  echo "ℹ️ Detected UNPATCHED xtables.c - Saving as xtables_original.c"
                  echo "- 📄 **Source**: \`xtables_original.c\` (⚠️ Original/Unpatched)" >> "$REPORT_FILE"
              fi
          else
               echo "⚠️ Warning: xtables.c not found"
               echo "- ❌ **Source**: xtables.c not found!" >> "$REPORT_FILE"
          fi
          
          if [ -f "$IPT_SRC_DIR/config.log" ]; then
              cp "$IPT_SRC_DIR/config.log" "$DEBUG_DIR/config.log"
              echo "- 🔧 **Log**: \`config.log\` included" >> "$REPORT_FILE"
          fi

          if [ -d "$IMAGES_DIR" ]; then
            echo "Scanning $IMAGES_DIR for images..."
            if [ -f "$PARTITIONS_FILE" ]; then
              MAX_FW_SIZE="$(awk '/Firmware/ { getline; getline; sub(",", ""); print strtonum($2); }' "$PARTITIONS_FILE")"
              echo "Max Firmware Size Allowed: $MAX_FW_SIZE bytes"
            else
              MAX_FW_SIZE=0
              echo "::warning:: Partition config not found, skipping size check."
            fi

            find "$IMAGES_DIR" -maxdepth 1 -type f \( -name "*.trx" -o -name "*.bin" \) | while read -r file; do
              fname=$(basename "$file")
              fsize=$(stat -c \%s "$file")
              cp -v "$file" "$PACK_DIR/"
              
              if (( fsize < 500000 )); then
                echo "- 📦 **U-Boot**: \`$fname\` ($(numfmt --to=iec $fsize))" >> "$REPORT_FILE"
              else
                echo "- 💿 **Firmware**: \`$fname\` ($(numfmt --to=iec $fsize))" >> "$REPORT_FILE"
                if (( MAX_FW_SIZE > 0 )); then
                  if (( fsize > MAX_FW_SIZE )); then
                    echo "::error:: Firmware $fname ($fsize bytes) exceeds max size ($MAX_FW_SIZE bytes)!"
                    exit 1
                  else
                    echo "::notice:: $fname size check passed ($fsize / $MAX_FW_SIZE)"
                  fi
                fi
              fi
            done
          else
            echo "::warning:: Images directory not found."
            echo "- ❌ **Error**: No images directory found." >> "$REPORT_FILE"
          fi

          cd "$PACK_DIR"
          for f in *; do
            if [ -f "$f" ]; then
              md5sum "$f" >> md5sum.txt
            fi
          done
          
          FILE_REPORT_CONTENT=$(cat file_report.txt)
          {
            echo "FILE_REPORT<<EOF"
            echo "$FILE_REPORT_CONTENT"
            echo "EOF"
          } >> $GITHUB_ENV
          
          MAIN_FW=$(find . -type f \( -name "*.trx" -o -name "*.bin" \) -printf "%s\t%p\n" | sort -n | tail -1 | cut -f2)
          [ ! -z "$MAIN_FW" ] && echo "MAIN_FW_PATH=$PACK_DIR/${MAIN_FW#./}" >> $GITHUB_ENV
          
          cd "$WORK_DIR"

          if [ "$(ls -A$PACK_DIR)" ]; then
            ZIP_NAME="padavan_pack_${CONFIG_VENDOR}_${CONFIG_FIRMWARE_PRODUCT_ID}.zip"
            zip -j -r "$ZIP_NAME" "$PACK_DIR"
            echo "ZIP_FILE_PATH=$WORK_DIR/$ZIP_NAME" >> $GITHUB_ENV
          else
            echo "::error:: output_pack is empty!"
            exit 1
          fi
          
          echo "BUILD_TIMESTAMP=$(TZ='Asia/Taipei' date '+\%Y.\%m.\%d_\%H.\%M.\%S')" >> $GITHUB_ENV
          echo "CONFIG_VENDOR=$CONFIG_VENDOR" >> $GITHUB_ENV
          echo "CONFIG_FIRMWARE_PRODUCT_ID=$CONFIG_FIRMWARE_PRODUCT_ID" >> $GITHUB_ENV
          echo "::endgroup::"

      - name: Upload artifacts (ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: padavan_${{ env.CONFIG_VENDOR }}_${{ env.CONFIG_FIRMWARE_PRODUCT_ID }}_${{ env.BUILD_TIMESTAMP }}
          path: ${{ env.ZIP_FILE_PATH }}

      # 10. 發布 Release
      - name: Set Release Tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "TAG_NAME=${{ inputs.target_select }}-${{ env.BUILD_TIMESTAMP }}" >> $GITHUB_ENV

      - name: Publish Release
        if: github.event_name == 'workflow_dispatch'
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit: ${{ github.sha }}
          tag: ${{ env.TAG_NAME }}
          name: ${{ inputs.target_select }} [${{ env.BUILD_TIMESTAMP }}]
          body: |
            **Padavan 編譯報告 - Build firmware (Ultimate Fix - Early Size Check)**
            * **Release Model**: ${{ inputs.target_select }}
            * **Linux Kernel**: **3.4.113** (MT7628 SoC Optimized)
            * **LAN IP**: ${{ env.LANIP }}
            * **User**: ${{ env.SIGNACCOUNT }} / **Pass**: ${{ env.SIGNPASSWORD }}
            * **Wi-Fi 2.4G**: ${{ env.WIFI2GSSID }} / Key:${{ env.WIFI2GPSK }}
            * **Branch**: ${{ env.PADAVAN_BRANCH }} (${{ env.PADAVAN_COMMIT }})
            
            ### 📦 產物偵測
            ${{ env.FILE_REPORT }}
            
            ### 🛠 Debug 檔案 (已包含在 Zip)
            * `defaults.h.txt` (檢查 IP/帳密 是否修改成功)
            * `CN.dict.txt` (檢查語言檔)
            * `build.log` (編譯日誌)
            * `build.config` (編譯參數)
            * `kernel.config` (核心參數)
          artifacts: ${{ env.ZIP_FILE_PATH }}
          allowUpdates: true
          artifactErrorsFailBuild: true
