          if [ "$APPLY_PATCHES" = true ]; then
              if [ -d "$IPT_ROOT" ]; then
                  echo "🩹 Applying Custom Patch #100 IMMEDIATELY..."
                  if patch -d "$IPT_ROOT" -t -N -l -F 10 -p1 --no-backup-if-mismatch --reject-file=- < "$PATCH_100"; then
                      echo "✅ Patch #100 Applied Successfully."
                  else
                      echo "⚠️ Patch #100 Failed (Skipped or Mismatch)."
                      echo "[LOCAL] #100 PATCH_FAIL : Custom_Suppress_Warnings" >> "$LOG_FILE"
                  fi
              else
                  echo "⚠️ Source directory not ready for immediate patching."
              fi
              
              IPT_MAKEFILE="padavan-ng/trunk/user/iptables/Makefile"
              if [ -f "$IPT_MAKEFILE" ]; then
                  sed -i 's@tar xJf $(SRC_NAME).tar.xz;@tar xJf $(SRC_NAME).tar.xz; echo "🩹 Patching..."; for p in `ls ../patches_archive/*.patch | sort`; do echo "   - Applying $$p"; patch -d $(SRC_NAME) -p1 < $$p || true; done;@' "$IPT_MAKEFILE"
