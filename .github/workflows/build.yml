        description: "自訂預設配置 JSON"
        required: true
        type: string
        default: '{"lanip":"192.168.1.1","signaccount":"admin","signpassword":"admin","wifi2gssid":"Thanh2012_2.4G","wifi2gpsk":"thanh04012012"}'

  push:
