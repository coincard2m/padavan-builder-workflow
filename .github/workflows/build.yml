        description: "開啟極限瘦身 (Nano Optimization)"
        type: boolean
        default: true

      customization:
        description: '自訂預設配置 JSON (Custom Default Configuration Wi-Fi/Passwords/IP)'
        required: true
        type: string
        default: '{"lanip":"192.168.1.1","signaccount":"admin","signpassword":"admin","wifi2gssid":"Thanh2012_2.4G","wifi2gpsk":"thanh04012012","wifi5gssid":"Padavan-5G","wifi5gpsk":"1234567890"}'

  push:
