              fi
          else
              echo "📦 Custom Patch #100 generated but NOT applied."
              echo "🚫 Skipping Makefile injection (APPLY_PATCHES=false)"
          fi
          
          echo "🔍 Verifying code content (Checking for applied changes)..."
          VERIFY_TARGET="libxtables/xtables.c"
          
          if [ -f "$IPT_ROOT/$VERIFY_TARGET" ]; then
              if grep -q "#if 0" "$IPT_ROOT/$VERIFY_TARGET" && grep -q "Warning: Extension %s is not supported" "$IPT_ROOT/$VERIFY_TARGET"; then
                  echo "✅ Verification Passed: Code IS patched/modified (Warnings suppressed)."
                  grep -nC 3 "Warning: Extension %s is not supported" "$IPT_ROOT/$VERIFY_TARGET"
              else
                  echo "⚠️ Verification Result: Code is UNPATCHED (Warnings active)."
                  grep -nC 3 "Warning: Extension %s is not supported" "$IPT_ROOT/$VERIFY_TARGET"
              fi
          else
              echo "ℹ️ Verification skipped: Source file $VERIFY_TARGET not found yet (will be extracted during build)."
          fi
          
          echo "🔍 開始掃描並修復依賴舊版 iptables ($OLD_VER_STR) 的其他套件..."
          if [ -z "$OLD_VER_STR" ]; then
              echo "⚠️ Warning: Could not detect OLD_VER_STR automatically. Fallback to 1.8.10"
              OLD_VER_STR="iptables-1.8.10"
          fi

          grep -rl "$OLD_VER_STR" padavan-ng/trunk/user/ | while read -r file ; do
              echo "  - 修復路徑: $file"
              sed -i "s/$OLD_VER_STR/$NEW_VER/g" "$file"
          done
          
          echo "🎉 全局路徑替換完成！所有套件現在都指向 $NEW_VER"
          
