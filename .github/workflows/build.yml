              "CONFIG_UDPSVD"
              "CONFIG_STACK_OPTIMIZATION_386"
              "CONFIG_RESUME"
              "CONFIG_BLKDISCARD"
              "CONFIG_LINUX32"
              "CONFIG_LINUX64"
              "CONFIG_SETPRIV"
              "CONFIG_UNSHARE"
              "CONFIG_NSENTER"
              "CONFIG_I2CTRANSFER"
              "CONFIG_FALLOCATE"
              "CONFIG_FSFREEZE"
              "CONFIG_FEATURE_VOLUMEID_BCACHE"
              "CONFIG_FEATURE_VOLUMEID_EROFS"
              "CONFIG_FEATURE_VOLUMEID_MINIX"
          )

          audit_config() {
              local FILE=$1
              local LIST_NAME=$2 
              local FAILURES=()
              if [ ! -f "$FILE" ]; then return 1; fi
              for ENTRY in "${CHECKS_SET[@]}"; do
                  KEY=${ENTRY%% *}
                  VAL=${ENTRY#* }
                  if ! grep -q "^${KEY}=${VAL}$" "$FILE"; then
                      FAILURES+=("$ENTRY")
                  fi
              done
              for KEY in "${CHECKS_UNSET[@]}"; do
                  if grep -q "^${KEY}=" "$FILE"; then
                      FAILURES+=("$KEY UNSET")
                  fi
              done
              if [ ${#FAILURES[@]} -gt 0 ]; then
                  eval "$LIST_NAME=(\"\${FAILURES[@]}\")"
                  return 1
              fi
              return 0
          }

          apply_fixes() {
              local FILE=$1
              local ITEMS=("${@:2}")
              for ITEM in "${ITEMS[@]}"; do
                  if [[ "$ITEM" == *" UNSET" ]]; then
                      KEY=${ITEM% UNSET}
                      sed -i "/$KEY/d" "$FILE"
                      echo "# $KEY is not set" >> "$FILE"
                  else
                      KEY=${ITEM%% *}
                      VAL=${ITEM#* }
                      sed -i "/$KEY/d" "$FILE"
                      echo "$KEY=$VAL" >> "$FILE"
                  fi
              done
          }

          if [ -f "$SYNC_TARGET_3" ]; then
              cp -f "$SYNC_TARGET_3" .config
          fi
          yes "" | make oldconfig || true

          for ENTRY in "${CHECKS_SET[@]}"; do
              KEY=${ENTRY%% *}
              sed -i "/$KEY/d" .config
          done
          for KEY in "${CHECKS_UNSET[@]}"; do
              sed -i "/$KEY/d" .config
          done

          {
              echo "# --- Custom Injection Start ---"
              for ENTRY in "${CHECKS_SET[@]}"; do
                  KEY=${ENTRY%% *}
                  VAL=${ENTRY#* }
                  echo "$KEY=$VAL"
              done
              for KEY in "${CHECKS_UNSET[@]}"; do
                  echo "# $KEY is not set"
              done
              echo "# --- Custom Injection End ---"
          } >> .config

          yes "" | make oldconfig || true

          CURRENT_FILE=".config"
          FAIL_LIST_1=()
          if ! audit_config "$CURRENT_FILE" FAIL_LIST_1; then
              apply_fixes "$CURRENT_FILE" "${FAIL_LIST_1[@]}"
          fi
          
          mkdir -p "$(dirname "$SYNC_TARGET_3")"
          cp -f .config "$SYNC_TARGET_2"
          cp -f .config "$SYNC_TARGET_3"

          cd "../../rc"
          RC_FILE="services.c" 
          if [ -f "$RC_FILE" ]; then
              sed -i 's/NULL,[[:space:]]*\/\*[[:space:]]*-L[[:space:]]*\*\//"-L",\t\t\t\t\/* log locally *\//' "$RC_FILE"
              sed -i '/syslogd_argv\[7\] = "-L";/d' "$RC_FILE"
          fi

          cd ../.. 
          grep -rl "busybox-1.24.x" user/ | xargs -r sed -i "s/busybox-1.24.x/busybox-1.37.0/g" || true
          grep -rl "busybox-1.24.2" user/ | xargs -r sed -i "s/busybox-1.24.2/busybox-1.37.0/g" || true
          
          find . -maxdepth 1 -name "*.sh" -o -name "build_firmware*" | while read -r script; do
             if grep -q 'busybox_id="1.24.x"' "$script"; then
                sed -i 's/busybox_id="1.24.x"/busybox_id="1.37.0"/' "$script"
             fi
          done

          cd user/busybox
          if [ -d "busybox-1.37.0" ]; then cd "busybox-1.37.0"; fi
          
          if [ -f "archival/libarchive/header_list.c" ]; then
              sed -i 's/puts(file_header->name);/puts(printable_string(file_header->name));/' archival/libarchive/header_list.c
          fi
          if [ -f "archival/libarchive/header_verbose_list.c" ]; then
              sed -i 's/file_header->name);/printable_string(file_header->name));/' archival/libarchive/header_verbose_list.c
              sed -i 's/printf(" -> %s", file_header->link_target);/printf(" -> %s", printable_string(file_header->link_target));/' archival/libarchive/header_verbose_list.c
          fi

          set +x
          echo "::endgroup::"
      
      - name: 🔥 Auto Upgrade iptables 1.8.11 & Patch
        run: |
          set +e
          set -x
          
          echo "::group::Iptables Upgrade & Patching"
          NEW_VER="iptables-1.8.11"
          
          IPT_MAKEFILE=$(find padavan-ng/trunk/user/iptables -name Makefile | head -n 1)
          IPT_DIR=$(dirname "$IPT_MAKEFILE")
          IPT_ROOT="$IPT_DIR/$NEW_VER"
          
          OLD_VER_STR=$(grep -o 'iptables-[0-9.]*' "$IPT_MAKEFILE" | head -n 1)
          [ -z "$OLD_VER_STR" ] && OLD_VER_STR="iptables-1.8.10"

          TAR_FILE="$IPT_DIR/$NEW_VER.tar.xz"
          if [ ! -f "$TAR_FILE" ]; then
              wget --no-check-certificate -q -O "$TAR_FILE" "https://www.netfilter.org/projects/iptables/files/$NEW_VER.tar.xz" || \
              wget --no-check-certificate -q -O "$TAR_FILE" "https://www.netfilter.org/projects/iptables/files/old/$NEW_VER.tar.xz"
          fi
          
          if [ -f "$TAR_FILE" ]; then
              tar -xJf "$TAR_FILE" -C "$IPT_DIR" 2>/dev/null || true
          fi

          sed -i "s/$OLD_VER_STR/$NEW_VER/g" "$IPT_MAKEFILE"
          sed -i 's/^all: config_test/all: download_test extract_test config_test/' "$IPT_MAKEFILE"
          sed -i '/.\/autogen.sh/d' "$IPT_MAKEFILE"
          sed -i '/extensions\/disabled\//d' "$IPT_MAKEFILE"

          PATCH_DIR="$IPT_DIR/patches_archive"
          mkdir -p "$PATCH_DIR"

          # Tải danh sách patch trực tiếp qua URL an toàn, không dùng khối Here-Doc
          patch_urls=(
            "https://git.netfilter.org/iptables/patch/?id=0506bea1dcc8f12d94e7c32bf2fb04abb3fdd269"
            "https://git.netfilter.org/iptables/patch/?id=e6e232d0ae252b0b86278455b18d9475b95db8f0"
            "https://git.netfilter.org/iptables/patch/?id=40406dbfaefbc204134452b2747bae4f6a122848"
            "https://git.netfilter.org/iptables/patch/?id=b3f3e256c263b9a1db49732696aba0dde084ef5e"
            "https://git.netfilter.org/iptables/patch/?id=6310639f697d4a570286960c470a6ec8c324be89"
            "https://git.netfilter.org/iptables/patch/?id=17fb168f007eb4200a1d3325898cf5256a029d81"
            "https://git.netfilter.org/iptables/patch/?id=d84b1647514f3121bd4a6adfca9a977751c39bbc"
            "https://git.netfilter.org/iptables/patch/?id=2db8bf2fbf080f6a054b658df65c468bfa0db68d"
            "https://git.netfilter.org/iptables/patch/?id=f6f0f4f55794a5f1add6f728f80f29f12f36ecd5"
            "https://git.netfilter.org/iptables/patch/?id=ff5f6a208efccd4e2bd8d4fdaf5d284ce54ff69e"
            "https://git.netfilter.org/iptables/patch/?id=739d9bd57ad26bd52bed569264daa97b5943e08d"
            "https://git.netfilter.org/iptables/patch/?id=7746fa0b1619e1bd8465c9a98bdbead628ed428a"
            "https://git.netfilter.org/iptables/patch/?id=fdb541cddad0681ea3ab1fca8a3949dcf49fb194"
            "https://git.netfilter.org/iptables/patch/?id=1e6a2812971a268428b04b03520cd68cb61d76e3"
            "https://git.netfilter.org/iptables/patch/?id=192c3a6bc18f206895ec5e38812d648ccfe7e281"
            "https://git.netfilter.org/iptables/patch/?id=12e6b5ed65fd91ea413a2e45201289c3d01c4e29"
            "https://git.netfilter.org/iptables/patch/?id=d33c6ad308cf7b9f627aeed48a5163c0374b5035"
            "https://git.netfilter.org/iptables/patch/?id=786b75f7c9b9feaa294da097c2e9727747162c79"
            "https://git.netfilter.org/iptables/patch/?id=f66687b6cb5fd0bb36107c30339aa7f4ff75e98e"
            "https://git.netfilter.org/iptables/patch/?id=8cb0c13b7777e72ca6f4265845dc99eff7cdf679"
            "https://git.netfilter.org/iptables/patch/?id=102e9607c63266c7f3413f8dcae51d9476e396e4"
            "https://git.netfilter.org/iptables/patch/?id=c3d5053db05f99bd72219aebeefc7fb0195ac041"
            "https://git.netfilter.org/iptables/patch/?id=78d7a5f8619f3965ec2da13003a876c808c40cfb"
          )

          count=0
          for p_url in "${patch_urls[@]}"; do
              count=$((count+1))
              count_str=$(printf "%02d" $count)
              patch_file="$PATCH_DIR/${count_str}.patch"
              curl -k -L -s --connect-timeout 15 -o "$patch_file" "$p_url" || true
              if [ -s "$patch_file" ] && [ -d "$IPT_ROOT" ]; then
                  patch -d "$IPT_ROOT" -t -N -l -F 10 -p1 < "$patch_file" 2>/dev/null || true
              fi
          done

          if [ -f "$IPT_ROOT/libxtables/xtables.c" ]; then
              sed -i 's/fprintf(stderr,[[:space:]]*"Warning: Extension %s is not supported/\/\/ &/' "$IPT_ROOT/libxtables/xtables.c"
          fi

          grep -rl "$OLD_VER_STR" padavan-ng/trunk/user/ | while read -r file ; do
              sed -i "s/$OLD_VER_STR/$NEW_VER/g" "$file"
          done
          echo "::endgroup::"

      - name: 🔥 Network Tools (Smart Compile Arptables)
        run: |
          echo "::group::Smart Compile Network Tools"
          BASE_DIR="$GITHUB_WORKSPACE/padavan-ng/trunk/user"
          ARP_ROOT="$BASE_DIR/arptables"
          
          mkdir -p "$ARP_ROOT"
          cd "$ARP_ROOT" || exit 1
          
          if [ ! -f "Makefile" ] || ! grep -q "arptables" "Makefile"; then
            ARP_TAR="arptables-0.0.5.tar.gz"
            ARP_URL="https://www.netfilter.org/pub/arptables/arptables-0.0.5.tar.gz"
            
            wget --no-check-certificate "$ARP_URL" -O "$ARP_TAR" || exit 1
            tar -xf "$ARP_TAR" || exit 1
            rm -f "$ARP_TAR"
            
            ARP_SRC_NAME=$(ls -d arptables-0*/ | head -n 1 | sed 's/\///')
            chmod -R u+w "$ARP_SRC_NAME"
          
            echo "SRC_NAME=$ARP_SRC_NAME" > Makefile
            echo "all:" >> Makefile
            echo -e "\t\$(MAKE) -C \$(SRC_NAME) CC=\"\$(CC)\" AR=\"\$(AR)\" KERNEL_DIR=\$(KERNEL_HEADERS_PATH) COPT_FLAGS=\"-Os -static\" LDFLAGS=\"-static\" arptables-legacy" >> Makefile
            echo "romfs:" >> Makefile
            echo -e "\t\$(ROMFSINST) \$(SRC_NAME)/arptables-legacy /bin/arptables" >> Makefile
            echo "clean:" >> Makefile
            echo -e "\t\$(MAKE) -C \$(SRC_NAME) clean" >> Makefile
          
            cd "$BASE_DIR" || exit 1
            if ! grep -q "dir_y += arptables" Makefile; then
                if grep -q "dir_y += ebtables" Makefile; then
                    sed -i '/dir_y += ebtables/a dir_y += arptables' Makefile
                else
                    echo "dir_y += arptables" >> Makefile
                fi
            fi
          fi

          cd "$GITHUB_WORKSPACE"
          TARGET_KCONF="padavan-ng/trunk/linux-3.4.x/.config"
          if [ -f "$TARGET_KCONF" ]; then
             MODULES="CONFIG_IP_NF_ARPTABLES CONFIG_IP_NF_ARPFILTER CONFIG_IP_NF_ARP_MANGLE CONFIG_NF_LOG_ARP CONFIG_BRIDGE_EBT_ARP CONFIG_BRIDGE_EBT_ARPREPLY"
             for mod in $MODULES; do
                if grep -q "$mod" "$TARGET_KCONF"; then
                   sed -i "s|^.*$mod.*$|$mod=m|" "$TARGET_KCONF"
                else
                   echo "$mod=m" >> "$TARGET_KCONF"
                fi
             done
          fi
          echo "::endgroup::"

      - name: 🔥 Patch Wi-Fi Driver (Anti-Disconnect & Fast Reconnect)
        run: |
          echo "::group::Applying Universal Wi-Fi Driver Patch"
          APCLI_FILES=$(find padavan-ng/trunk/proprietary/rt_wifi -type f -name "ap_apcli.c" 2>/dev/null || true)
          CTRL_FILES=$(find padavan-ng/trunk/proprietary/rt_wifi -type f -name "apcli_ctrl.c" 2>/dev/null || true)

          if [ -n "$APCLI_FILES" ]; then
            for f in $APCLI_FILES; do
              sed -i 's/12[[:space:]]*\*[[:space:]]*OS_HZ/60 * OS_HZ/g' "$f" 2>/dev/null || true
            done
          fi

          if [ -n "$CTRL_FILES" ]; then
            for f in $CTRL_FILES; do
              sed -i 's/^[[:space:]]*NdisZeroMemory.*ApCliMlmeAux.Bssid/\/\/&/' "$f" 2>/dev/null || true
              sed -i 's/^[[:space:]]*.*ApCliMlmeAux.SsidLen[[:space:]]*=[[:space:]]*0/\/\/&/' "$f" 2>/dev/null || true
              sed -i 's/^[[:space:]]*NdisZeroMemory.*ApCliMlmeAux.Ssid,/\/\/&/' "$f" 2>/dev/null || true
              sed -i 's/^[[:space:]]*.*ApCliMlmeAux.Rssi[[:space:]]*=[[:space:]]*0/\/\/&/' "$f" 2>/dev/null || true
            done
          fi
          echo "::endgroup::"

      - name: 🌐 Custom Language Selector
        run: |
          echo "::group::Setting up WebUI Language"
          SELECTED_LANG_OPTION="${{ inputs.language_select }}"
          TARGET_BOARD="${{ inputs.target_select }}"
          TEMPLATES_DIR="padavan-ng/trunk/configs/templates"
          
          if [ "$SELECTED_LANG_OPTION" == "English_Only" ]; then
            LANG_CODE="NONE"
            echo "RELEASE_LANG=English Only" >> $GITHUB_ENV
          else
            LANG_CODE=$(echo "$SELECTED_LANG_OPTION" | cut -d' ' -f1)
            echo "RELEASE_LANG=English + $SELECTED_LANG_OPTION" >> $GITHUB_ENV
          fi
          
          CONFIG_PATH=$(find "$TEMPLATES_DIR" -type f -name "*.config" | grep -i "$TARGET_BOARD.config" | head -n 1)
          if [ -z "$CONFIG_PATH" ]; then
             CONFIG_PATH=$(find "$TEMPLATES_DIR" -type f -name "*.config" | grep -i "$TARGET_BOARD" | head -n 1)
          fi
          
          if [ -f "$CONFIG_PATH" ]; then
            sed -i 's/^CONFIG_FIRMWARE_INCLUDE_LANG_.*=y/#&/' "$CONFIG_PATH"
            if [ "$LANG_CODE" != "NONE" ]; then
              TARGET_LANG_CONFIG="CONFIG_FIRMWARE_INCLUDE_LANG_$LANG_CODE"
              if grep -q "$TARGET_LANG_CONFIG" "$CONFIG_PATH"; then
                sed -i "s/^.*$TARGET_LANG_CONFIG.*/$TARGET_LANG_CONFIG=y/" "$CONFIG_PATH"
              else
                echo "$TARGET_LANG_CONFIG=y" >> "$CONFIG_PATH"
              fi
            fi
          fi
          echo "::endgroup::"
      
      - name: 🕊️ Dave Täht Tribute & CAKE Patch
        run: |
          echo "::group::Applying CAKE to Kernel 3.4 Config"
          TARGET_BOARD="${{ inputs.target_select }}"
          BOARDS_DIR="padavan-ng/trunk/configs/boards"
          CONFIG_PATH=$(find "$BOARDS_DIR" -name "kernel-3.4.x.config" | grep "/$TARGET_BOARD/" | head -n 1)

          if [ -z "$CONFIG_PATH" ]; then
             CONFIG_PATH=$(find "$BOARDS_DIR" -type f -name "kernel-3.4.x.config" | grep "$TARGET_BOARD" | head -n 1)
          fi

          if [ -f "$CONFIG_PATH" ]; then
            if ! grep -qE "CONFIG_NET_SCH_CAKE=[ym]" "$CONFIG_PATH"; then
              if grep -qE "CONFIG_NET_SCH_FQ_CODEL=[ym]" "$CONFIG_PATH"; then
                sed -i '/CONFIG_NET_SCH_FQ_CODEL=/a CONFIG_NET_SCH_CAKE=m' "$CONFIG_PATH"
              else
                echo "CONFIG_NET_SCH_CAKE=m" >> "$CONFIG_PATH"
              fi
            fi
          fi
          echo "::endgroup::"
      
      - name: Build firmware
        run: |
          echo "::group::Build Process"
          cp build.config padavan-ng/trunk/.config
          cd padavan-ng/trunk
          
          ./clear_tree.sh > /dev/null 2>&1
          rm -rf tmp staging
          
          set -o pipefail
          ./build_firmware.sh 2>&1 | tee build.log
          echo "::endgroup::"

      - name: Smart-Pack & Debug Collection
        run: |
          echo "::group::Smart Packing"
          if [ -f "padavan-ng/trunk/.config" ]; then
            source "padavan-ng/trunk/.config"
          fi

          WORK_DIR="$(pwd)"
          PACK_DIR="$WORK_DIR/output_pack"
          IMAGES_DIR="$WORK_DIR/padavan-ng/trunk/images"
          
          mkdir -p "$PACK_DIR"
          REPORT_FILE="$PACK_DIR/file_report.txt"
          touch "$REPORT_FILE"
          
          [ -f "padavan-ng/trunk/.config" ] && cp "padavan-ng/trunk/.config" "$PACK_DIR/build.config"
          [ -f "padavan-ng/trunk/configs/boards/busybox.config" ] && cp "padavan-ng/trunk/configs/boards/busybox.config" "$PACK_DIR/busybox.config"
          [ -f "padavan-ng/trunk/user/shared/defaults.h" ] && cp "padavan-ng/trunk/user/shared/defaults.h" "$PACK_DIR/defaults.h.txt"
          [ -f "padavan-ng/trunk/user/www/dict/CN.dict" ] && cp "padavan-ng/trunk/user/www/dict/CN.dict" "$PACK_DIR/CN.dict.txt"
          [ -f "padavan-ng/trunk/linux-3.4.x/.config" ] && cp "padavan-ng/trunk/linux-3.4.x/.config" "$PACK_DIR/kernel.config"
          [ -f "padavan-ng/trunk/build.log" ] && cp "padavan-ng/trunk/build.log" "$PACK_DIR/build.log"

          if [ -d "$IMAGES_DIR" ]; then
            find "$IMAGES_DIR" -maxdepth 1 -type f \( -name "*.trx" -o -name "*.bin" \) | while read -r file; do
              fname="$(basename "$file")"
              fsize="$(stat -c \%s "$file")"
              cp -v "$file" "$PACK_DIR/"
              
              if [ "$fsize" -lt 500000 ]; then
                echo "- 📦 **U-Boot**: \`$fname\` ($(numfmt --to=iec $fsize))" >> "$REPORT_FILE"
              else
                echo "- 💿 **Firmware**: \`$fname\` ($(numfmt --to=iec $fsize))" >> "$REPORT_FILE"
              fi
            done
          fi

          cd "$PACK_DIR"
          for f in *; do
            if [ -f "$f" ]; then
              md5sum "$f" >> md5sum.txt
            fi
          done
          
          FILE_REPORT_CONTENT="$(cat file_report.txt)"
          {
            echo "FILE_REPORT<<EOF"
            echo "$FILE_REPORT_CONTENT"
            echo "EOF"
          } >> $GITHUB_ENV
          
          cd "$WORK_DIR"
          FILE_COUNT="$(find "$PACK_DIR" -type f | wc -l)"
          if [ "$FILE_COUNT" -gt 0 ]; then
            ZIP_NAME="padavan_pack_wr841n_v13.zip"
            zip -j -r "$ZIP_NAME" "$PACK_DIR"
            echo "ZIP_FILE_PATH=$WORK_DIR/$ZIP_NAME" >> $GITHUB_ENV
          else
            echo "::error:: output_pack is empty!"
            exit 1
          fi
          
          # Đảm bảo chuỗi ngày giờ sạch sẽ, không chứa ký tự escape gạch chéo
          CLEAN_TIME="$(TZ='Asia/Ho_Chi_Minh' date '+%Y.%m.%d_%H%M%S')"
          echo "BUILD_TIMESTAMP=$CLEAN_TIME" >> $GITHUB_ENV
          echo "::endgroup::"

      - name: Upload artifacts (ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: padavan_firmware_wr841n_v13
          path: ${{ env.ZIP_FILE_PATH }}
