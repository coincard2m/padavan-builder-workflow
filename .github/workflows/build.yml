              "CONFIG_FEATURE_INIT_MODIFY_CMDLINE y"
              "CONFIG_MKPASSWD y"
              "CONFIG_MODINFO y"
              "CONFIG_GETOPT y"
              "CONFIG_FEATURE_GETOPT_LONG y"
              "CONFIG_HEXDUMP y"
              "CONFIG_XXD y"
              "CONFIG_FEATURE_MDEV_DAEMON y"
              "CONFIG_MKE2FS y"
              "CONFIG_MKDOSFS y"
              "CONFIG_BC y"
              "CONFIG_FEATURE_DC_BIG y"
              "CONFIG_FEATURE_BC_INTERACTIVE y"
              "CONFIG_FEATURE_BC_LONG_OPTIONS y"
              "CONFIG_FEATURE_CROND_SPECIAL_TIMES y"
              "CONFIG_GETFATTR y"
              "CONFIG_HEXEDIT y"
              "CONFIG_LSSCSI y"
              "CONFIG_MIM y"
              "CONFIG_PARTPROBE y"
              "CONFIG_SEEDRNG y"
              "CONFIG_SETFATTR y"
              "CONFIG_TS y"
