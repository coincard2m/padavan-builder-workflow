              "CONFIG_FEATURE_INIT_MODIFY_CMDLINE y"
              "CONFIG_MKPASSWD y"
              "CONFIG_MODINFO y"
              "CONFIG_GETOPT y"
              "CONFIG_FEATURE_GETOPT_LONG y"
              "CONFIG_HEXDUMP y"
              "CONFIG_XXD y"
              "CONFIG_FEATURE_MDEV_DAEMON y"
              "CONFIG_MKE2FS y"
              "CONFIG_MKDOSFS y"
              "CONFIG_BC y"
